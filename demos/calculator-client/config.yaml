# Calculator Client Configuration
# This config embeds grpc-mesh-server settings plus application-specific settings.
# The server.* / listener.* / logging.* / auth.* keys below are the schema read
# by pkg/config (github.com/grpc-mesh/grpc-mesh-server).

# Application-specific settings
app:
  # HTTP API server listen address
  listen_address: ":8080"
  # Default target node ID for calculator service
  target_node_id: "calculator-service"

# Embedded gRPC Mesh Server Configuration
server:
  grpc_address: ":50051"
  metrics_address: ":9090"

listener:
  address: ":8443"
  cert_file: "../../grpc-mesh-server/config/tls/server-chain.crt"
  key_file: "../../grpc-mesh-server/config/tls/server.key"
  ca_file: "" # empty disables mTLS (client certificate verification)

logging:
  level: "info"

auth:
  enabled: true
  # Per-node tokens: the demo calculator-service presents this token and is
  # only accepted when it also claims node id "calculator-service".
  node_tokens:
    calculator-service: "waemu_7RCx4i4T6gU3O9Gqcx4-SvHMRN1V8dJ9"
